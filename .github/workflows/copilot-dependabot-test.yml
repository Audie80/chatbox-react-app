name: Test Copilot on Dependabot PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to process"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  copilot:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json headRefName,headRepositoryOwner \
            --jq '.headRefName'

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "
          You are working on Dependabot pull request #${{ inputs.pr_number }}.

          Your task is to make this dependency update ready to merge.

          First inspect the current repository state and the changes already
          present in this branch.

          Then:
          1. Understand exactly what Dependabot is updating.
          2. Inspect package.json and package-lock.json.
          3. Run the project's relevant tests, linting, type checking and build.
          4. Fix issues caused by the dependency update.
          5. Do not make unrelated changes.
          6. Do not change application behavior unless necessary for compatibility.
          7. When everything passes, commit the necessary changes.
          8. Do not merge the pull request.

          Work autonomously until the task is complete.
          " \
          --allow-tool='shell(git:*)' \
          --allow-tool='shell(npm:*)' \
          --allow-tool='shell(npx:*)' \
          --allow-tool=write \
          --no-ask-user
